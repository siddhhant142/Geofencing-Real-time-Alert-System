services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATA_FILE: /app/data/store.json
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
